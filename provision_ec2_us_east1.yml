---
# Provision 2 EC2 instances (Amazon Linux 2023) in us-east-1 via role provision_ec2_us_east1.
#
# Prereqs:
# - ansible-galaxy collection install -r requirements.yml
# - AWS credentials via profile or keys
#
# Optional:
#   ansible-playbook provision_ec2_us_east1.yml -e ec2_key_name=my-key -e ssh_cidr=203.0.113.10/32

- name: Provision two EC2 instances in us-east-1
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - provision_ec2_us_east1
