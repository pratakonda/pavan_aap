---
# Provision 2 EC2 instances (Amazon Linux 2023, t3.micro) in us-east-1 with one key pair.
#
# Prereqs:
# - pip install boto3 botocore  (often installed with Ansible AWX/control node)
# - ansible-galaxy collection install -r requirements.yml
# - Export AWS_PROFILE or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (and optional AWS_SESSION_TOKEN)
#
# Optional extra vars:
#   ansible-playbook provision_ec2_us_east1.yml \
#     -e ec2_key_name=my-key \
#     -e ssh_cidr=203.0.113.10/32

- name: Provision two EC2 instances in us-east-1
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: us-east-1
    ec2_key_name: ansible-al2023-us-east-1
    sg_name: ansible-al2023-ssh-sg
    # Restrict this in production; default is permissive for quick demos.
    ssh_cidr: "0.0.0.0/0"
    ami_name_pattern: "al2023-ami-*-*-x86_64"
    instance_pairs:
      - "{{ ansible_al2023_host_1 }}"
      - "{{ ansible_al2023_host_2 }}"
    ansible_al2023_host_1: al2023-demo-01
    ansible_al2023_host_2: al2023-demo-02

  tasks:
    - name: Resolve Amazon Linux 2023 AMI
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners: amazon
        filters:
          name: "{{ ami_name_pattern }}"
          state: available
          architecture: x86_64
          virtualization-type: hvm
      register: ami_list

    - name: Fail if no AMI found
      ansible.builtin.fail:
        msg: "No AMI matched pattern {{ ami_name_pattern }} in {{ aws_region }}. Adjust ami_name_pattern."
      when: ami_list.images | length == 0

    - name: Pick latest AMI by creation date
      ansible.builtin.set_fact:
        ami_id: >-
          {{
            (ami_list.images | sort(attribute='creation_date', reverse=true))[0].image_id
          }}

    - name: Discover default VPC
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
        filters:
          isDefault: "true"
      register: default_vpc

    - name: Fail if default VPC missing
      ansible.builtin.fail:
        msg: "No default VPC in {{ aws_region }}. Create a VPC/subnet or extend this playbook with explicit vpc_subnet_id."
      when: default_vpc.vpcs | length == 0

    - ansible.builtin.set_fact:
        default_vpc_id: "{{ default_vpc.vpcs[0].vpc_id }}"

    - name: Choose a subnet in the default VPC
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        filters:
          vpc-id: "{{ default_vpc_id }}"
          default-for-az: "true"
      register: subnet_info

    - name: Choose any subnet in default VPC when no default subnet tag
      when: subnet_info.subnets | length == 0
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        filters:
          vpc-id: "{{ default_vpc_id }}"
      register: subnet_info_fallback

    - ansible.builtin.set_fact:
        subnet_candidates: "{{ subnet_info.subnets if (subnet_info.subnets | length) > 0 else subnet_info_fallback.subnets }}"

    - name: Fail if no subnet exists in default VPC
      ansible.builtin.fail:
        msg: "No subnet found for default VPC {{ default_vpc_id }}."
      when: subnet_candidates | length == 0

    - ansible.builtin.set_fact:
        subnet_id: "{{ (subnet_candidates | sort(attribute='cidr_block'))[0].subnet_id }}"

    - name: Ensure EC2 key pair exists
      amazon.aws.ec2_key:
        region: "{{ aws_region }}"
        name: "{{ ec2_key_name }}"
        tags:
          Name: "{{ ec2_key_name }}"
          ManagedBy: Ansible
      register: created_key_pair

    - name: Save PEM when AWS generates a brand new key (only happens once)
      when: created_key_pair.private_key is defined
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/{{ ec2_key_name }}.pem"
        mode: "0600"
        content: "{{ created_key_pair.private_key }}"

    - name: Warn when key existed (no PEM returned)
      when: created_key_pair.private_key is not defined
      ansible.builtin.debug:
        msg: >-
          Key pair '{{ ec2_key_name }}' already exists in AWS; private key PEM is not downloadable.
          Use your existing PEM for ssh ec2-user@<public-dns> .

    - name: Allow SSH security group
      amazon.aws.ec2_security_group:
        region: "{{ aws_region }}"
        name: "{{ sg_name }}"
        description: Ansible-managed SSH security group
        vpc_id: "{{ default_vpc_id }}"
        rules:
          - proto: tcp
            ports:
              - 22
            cidr_ip: "{{ ssh_cidr }}"
            rule_desc: Ansible SSH ingress

    - name: Launch two t3.micro instances using the shared key pair
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        name: "{{ item }}"
        state: running
        instance_type: t3.micro
        key_name: "{{ ec2_key_name }}"
        vpc_subnet_id: "{{ subnet_id }}"
        image_id: "{{ ami_id }}"
        security_groups:
          - "{{ sg_name }}"
        tags:
          Name: "{{ item }}"
          OS: amazon-linux
          ManagedBy: Ansible
      loop: "{{ instance_pairs }}"
      register: launched

    - name: Describe launched instances
      ansible.builtin.debug:
        var: launched.results
