---
# Diagnose nginx issues on RHEL-family systems (RHEL, Rocky, Alma, Oracle Linux, etc.).
# Read-only: does not modify nginx configuration or restart services.
#
# Example:
#   ansible-playbook -i inventory nginx_diagnose_rhel.yml -l webservers
#
- name: Diagnose nginx errors on RHEL
  hosts: all
  become: true
  gather_facts: true

  vars:
    nginx_diagnose:
      error_log: /var/log/nginx/error.log
      access_log: /var/log/nginx/access.log
      journal_lines: 80
      log_tail_lines: 50

  tasks:
    - name: Confirm target is RedHat OS family
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
        fail_msg: >-
          This playbook targets RedHat-family OS.
          Detected family {{ ansible_os_family | default('unknown') }}.
        success_msg: OS family is RedHat as expected.

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Record nginx package presence
      ansible.builtin.set_fact:
        nginx_pkg_installed: "{{ 'nginx' in ansible_facts.packages }}"

    - name: Report nginx package status
      ansible.builtin.debug:
        msg:
          nginx_installed: "{{ nginx_pkg_installed }}"
          nginx_packages: "{{ ansible_facts.packages['nginx'] | default([]) }}"

    - name: Check nginx service state via systemctl
      ansible.builtin.command: systemctl status nginx --no-pager
      register: nginx_systemctl_status
      changed_when: false
      failed_when: false
      when: nginx_pkg_installed

    - name: Show systemctl status for nginx
      ansible.builtin.debug:
        var: nginx_systemctl_status.stdout_lines
      when: nginx_pkg_installed

    - name: Validate nginx configuration (nginx -t)
      ansible.builtin.command: nginx -t
      register: nginx_config_test
      changed_when: false
      failed_when: false
      when: nginx_pkg_installed

    - name: Report nginx configuration test
      ansible.builtin.debug:
        msg:
          return_code: "{{ nginx_config_test.rc }}"
          stderr: "{{ nginx_config_test.stderr | default('', true) }}"
          stdout: "{{ nginx_config_test.stdout | default('', true) }}"
      when: nginx_pkg_installed

    - name: Show TCP listeners (ss)
      ansible.builtin.command: ss -ltnp
      register: nginx_ss_listen
      changed_when: false
      when: nginx_pkg_installed

    - name: Show listener table
      ansible.builtin.debug:
        var: nginx_ss_listen.stdout_lines
      when: nginx_pkg_installed

    - name: Recent journal entries for nginx
      ansible.builtin.command: "journalctl -u nginx -n {{ nginx_diagnose.journal_lines }} --no-pager"
      register: nginx_journal
      changed_when: false
      when: nginx_pkg_installed

    - name: Show journalctl output
      ansible.builtin.debug:
        var: nginx_journal.stdout_lines
      when: nginx_pkg_installed

    - name: Stat nginx error log
      ansible.builtin.stat:
        path: "{{ nginx_diagnose.error_log }}"
      register: nginx_error_log_stat
      when: nginx_pkg_installed

    - name: Tail nginx error log
      ansible.builtin.command: "tail -n {{ nginx_diagnose.log_tail_lines }} {{ nginx_diagnose.error_log }}"
      register: nginx_error_tail
      changed_when: false
      when:
        - nginx_pkg_installed
        - nginx_error_log_stat.stat.exists | default(false)

    - name: Show nginx error log tail
      ansible.builtin.debug:
        var: nginx_error_tail.stdout_lines
      when:
        - nginx_pkg_installed
        - nginx_error_log_stat.stat.exists | default(false)

    - name: Stat nginx access log
      ansible.builtin.stat:
        path: "{{ nginx_diagnose.access_log }}"
      register: nginx_access_log_stat
      when: nginx_pkg_installed

    - name: Tail nginx access log
      ansible.builtin.command: "tail -n {{ nginx_diagnose.log_tail_lines }} {{ nginx_diagnose.access_log }}"
      register: nginx_access_tail
      changed_when: false
      when:
        - nginx_pkg_installed
        - nginx_access_log_stat.stat.exists | default(false)

    - name: Show nginx access log tail
      ansible.builtin.debug:
        var: nginx_access_tail.stdout_lines
      when:
        - nginx_pkg_installed
        - nginx_access_log_stat.stat.exists | default(false)

    - name: SELinux enforcing mode
      ansible.builtin.command: getenforce
      register: nginx_getenforce
      changed_when: false
      failed_when: false

    - name: Show SELinux mode
      ansible.builtin.debug:
        var: nginx_getenforce.stdout_lines

    - name: HTTP-related SELinux booleans
      ansible.builtin.shell: set -o pipefail; getsebool -a 2>/dev/null | grep -E '^httpd_' || true
      args:
        executable: /bin/bash
      register: nginx_sebool
      changed_when: false
      failed_when: false

    - name: Show httpd SELinux booleans
      ansible.builtin.debug:
        var: nginx_sebool.stdout_lines

    - name: Recent AVC lines mentioning httpd or nginx
      ansible.builtin.shell: |
        set -o pipefail
        if command -v ausearch >/dev/null 2>&1; then
          ausearch -m avc -ts recent 2>/dev/null | grep -iE 'nginx|httpd' | tail -n 20 || true
        fi
      args:
        executable: /bin/bash
      register: nginx_avc
      changed_when: false
      failed_when: false
      when: ansible_selinux is defined and ansible_selinux.status | default('disabled') == 'enabled'

    - name: Show AVC matches (if any)
      ansible.builtin.debug:
        var: nginx_avc.stdout_lines
      when:
        - ansible_selinux is defined
        - ansible_selinux.status | default('disabled') == 'enabled'
        - nginx_avc.stdout is defined
        - (nginx_avc.stdout | length) > 0

    - name: Note when nginx is not installed
      ansible.builtin.debug:
        msg: nginx package not found; install with dnf/yum before expecting service and logs.
      when: not nginx_pkg_installed
