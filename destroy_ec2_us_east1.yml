---
# Tear down EC2 instances created by provision_ec2_us_east1 (same vars by default).
#
# Prereqs: AWS credential on localhost (profile, env, or Automation Controller credential).
#
#   ansible-playbook destroy_ec2_us_east1.yml
# Optional:
#   ansible-playbook destroy_ec2_us_east1.yml -e destroy_remove_key_pair=true

- name: Destroy demo EC2 instances in us-east-1
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - destroy_ec2_us_east1
