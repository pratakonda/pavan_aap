<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Snake Demo</title><style>body{margin:0;background:#121212;color:#eee;font-family:system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}h1{margin:1rem 0 .5rem;font-size:1.25rem;font-weight:600}#b{border:3px solid #2ea043;border-radius:8px;background:#000;box-shadow:0 8px 28px rgba(0,0,0,.45)}#help{opacity:.85;font-size:.9rem;margin:.75rem 1rem;text-align:center;max-width:420px}</style></head><body><h1>Ansible Snake Demo</h1><canvas id=b width=420 height=420></canvas><p id=help>Arrow keys or WASD. Eat the red squares. Avoid the walls and yourself.</p><script>(()=>{const z=document.getElementById("b"),c=z.getContext("2d"),S=21,W=Math.floor(z.width/S),H=Math.floor(z.height/S);let x=8,y=8,dx=1,dy=0,body=[[8,8],[7,8],[6,8]],fx,fy,scr=0,timer,go=0;const pick=()=>{for(;;){fx=(Math.random()*W)|0;fy=(Math.random()*H)|0;if(!body.some(([a,b])=>a===fx&&b===fy))break}};const draw=()=>{c.fillStyle="#050505";c.fillRect(0,0,z.width,z.height);c.strokeStyle="#1f6feb";for(let i=0;i<W;i++)for(let j=0;j<H;j++){c.strokeRect(i*S+.5,j*S+.5,S-1,S-1)}c.fillStyle="#2ea043";for(const[bk,bl] of body)c.fillRect(bk*S+1,bl*S+1,S-2,S-2);c.fillStyle="#f85149";c.fillRect(fx*S+2,fy*S+2,S-4,S-4)};const step=()=>{if(go)return;x+=dx,y+=dy;if(x<0||y<0||x>=W||y>=H)return end();for(const[q,r]of body){if(q===x&&r===y)return end()}body.unshift([x,y]);if(x===fx&&y===fy){scr++;pick()}else body.pop();draw();document.title="Snake — "+scr};const end=()=>{go=1;clearInterval(timer);alert("Game over — score "+scr)};document.addEventListener("keydown",e=>{const k=e.key;if((k==="ArrowLeft"||k==="a"||k==="A")&&dx!==1){dx=-1;dy=0;e.preventDefault()}if((k==="ArrowRight"||k==="d"||k==="D")&&dx!==-1){dx=1;dy=0;e.preventDefault()}if((k==="ArrowUp"||k==="w"||k==="W")&&dy!==1){dx=0;dy=-1;e.preventDefault()}if((k==="ArrowDown"||k==="s"||k==="S")&&dy!==-1){dx=0;dy=1;e.preventDefault()}});pick();draw();timer=setInterval(step,130)})();</script></body></html>
