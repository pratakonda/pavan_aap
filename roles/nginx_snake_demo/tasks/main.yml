---
- name: Assert Amazon Linux (Red Hat family)
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
      - ansible_distribution | default('') is regex("amazon", ignorecase=True)
    fail_msg: >-
      This role targets Amazon Linux (distribution name should contain 'Amazon').
      Host '{{ inventory_hostname }}' reports {{ ansible_distribution }} (family {{ ansible_os_family }}).

- name: Refresh dnf cache and upgrade installed packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true

- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Remove stock default site if requested
  when: nginx_snake_remove_default_conf | bool
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx

- name: Install Snake demo static page
  ansible.builtin.copy:
    src: index.html
    dest: "{{ nginx_snake_document_root }}/index.html"
    mode: "0644"
    owner: root
    group: root

- name: Configure nginx to serve the demo on all interfaces
  ansible.builtin.template:
    src: snake-demo.conf.j2
    dest: /etc/nginx/conf.d/00-snake-demo.conf
    mode: "0644"
  notify: Reload nginx

- name: Ensure nginx enabled and started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Install firewalld when local firewall management is enabled
  when: nginx_snake_configure_firewall | bool
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Enable and start firewalld
  when: nginx_snake_configure_firewall | bool
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Open HTTP in firewalld
  when: nginx_snake_configure_firewall | bool
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true

- name: Reminder about cloud security groups for public access
  ansible.builtin.debug:
    msg: >-
      Nginx listens on port {{ nginx_snake_listen_port }}.
      For AWS EC2 ensure the security group allows inbound TCP {{ nginx_snake_listen_port }}
      from your clients (often 0.0.0.0/0 for a public demo). Local firewalld is
      nginx_snake_configure_firewall={{ nginx_snake_configure_firewall }}.
